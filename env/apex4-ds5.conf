# Hide the physical Apex 4 from SDL, so only the virtual DualSense is offered.
#
# Both spellings are needed: SDL3 renamed the hint and an application ignores
# whichever one it does not know. This covers both paths SDL uses to find the pad
# -- udev/evdev enumeration and its own hidraw scan -- so Steam Input can stay on
# and no per-game launch options are needed.
#
# Applies to the systemd user session, so Steam must be restarted to pick it up.
# To undo: delete this file and restart Steam.
SDL_JOYSTICK_IGNORE_DEVICES=0x04b4/0x2412
SDL_GAMECONTROLLER_IGNORE_DEVICES=0x04b4/0x2412
